<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Habit Studio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;background:#F4F7FC;color:#0E121C}
a{color:#4F5FA0}a:hover{color:#2B3358}
</style>
</helmet>
<div style="width:390px;height:1240px;position:relative;overflow:hidden;background:#F4F7FC;box-sizing:border-box;font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif;color:#0E121C;display:flex;flex-direction:column;padding:16px 20px 32px;">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
    <a href="HabitsHub.dc.html" aria-label="رجوع" style="flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:#FFFFFF;border:1px solid #DCE3EF;color:#3A4256;text-decoration:none;box-sizing:border-box;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <span style="font-size:13px;line-height:20px;font-weight:600;color:#4F5FA0;">الخطوة <bdi>{{stepNo}}</bdi> من <bdi>9</bdi></span>
  </div>

  <h1 style="margin:12px 0 0;font-size:22px;line-height:30px;font-weight:700;">استوديو العادات</h1>
  <p style="margin:4px 0 0;font-size:16px;line-height:26px;color:#3A4256;">نصمّم العادة خطوة خطوة — واضحة، سهلة البداية، وممتعة.</p>

  <div role="progressbar" aria-label="تقدّم التصميم" aria-valuemin="1" aria-valuemax="9" aria-valuenow="{{stepNo}}" style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin-top:16px;">
    <sc-for list="{{bar}}" as="seg" hint-placeholder-count="9">
      <span style="{{seg.s}}"></span>
    </sc-for>
  </div>

  <div style="margin-top:16px;display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:20px;background:#E1EEFB;">
    <span style="flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:999px;background:#FFFFFF;color:#2D5F92;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5M9 8h6"></path></svg>
    </span>
    <div style="flex:1;min-width:0;">
      <div style="font-size:15px;line-height:22px;font-weight:600;color:#2B3358;">مقترح من مكتبة الأدلة</div>
      <div style="font-size:13px;line-height:20px;font-weight:500;color:#2D5F92;">مراجعة مفردات <bdi>IELTS</bdi> — تكرار متباعد واسترجاع. عبّأنا الحقول، عدّلي اللي تبين.</div>
    </div>
  </div>

  <ol style="list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
      <li style="{{s.cardStyle}}">
        <button type="button" onClick="{{s.open}}" aria-expanded="{{s.expanded}}" style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 14px;border:0;background:transparent;cursor:pointer;font-family:inherit;color:#0E121C;text-align:right;box-sizing:border-box;">
          <span style="{{s.badgeStyle}}">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-label="مكتملة"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
            <sc-if value="{{s.notDone}}" hint-placeholder-val="{{false}}">{{s.num}}</sc-if>
          </span>
          <span style="display:flex;flex-direction:column;flex:1;min-width:0;">
            <span style="font-size:15px;line-height:22px;font-weight:600;">{{s.title}}</span>
            <span style="{{s.valueStyle}}">{{s.value}}</span>
          </span>
          <sc-if value="{{s.suggested}}" hint-placeholder-val="{{true}}">
            <span style="flex:none;height:24px;padding:0 8px;border-radius:999px;background:#EAF1FB;color:#4F5FA0;font-size:12px;line-height:24px;font-weight:600;">مقترح</span>
          </sc-if>
        </button>
        <sc-if value="{{s.showEditor}}" hint-placeholder-val="{{false}}">
          <div style="padding:0 14px 16px;display:flex;flex-direction:column;gap:12px;">
            <p style="margin:0;font-size:14px;line-height:22px;color:#3A4256;">{{s.help}}</p>
            <sc-if value="{{s.isVersions}}" hint-placeholder-val="{{true}}">
              <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;">
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:18px;font-weight:600;color:#4F5FA0;">أدنى
                  <input type="text" value="5 بطاقات" style="height:44px;border:1px solid #9BC4EE;border-radius:12px;padding:0 10px;font-family:inherit;font-size:14px;color:#0E121C;background:#FFFFFF;box-sizing:border-box;width:100%;">
                </label>
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:18px;font-weight:600;color:#5A6478;">عادي
                  <input type="text" value="10 د" style="height:44px;border:1px solid #DCE3EF;border-radius:12px;padding:0 10px;font-family:inherit;font-size:14px;color:#0E121C;background:#FFFFFF;box-sizing:border-box;width:100%;">
                </label>
                <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:18px;font-weight:600;color:#5A6478;">إضافي
                  <input type="text" value="15 د + جملة" style="height:44px;border:1px solid #DCE3EF;border-radius:12px;padding:0 10px;font-family:inherit;font-size:14px;color:#0E121C;background:#FFFFFF;box-sizing:border-box;width:100%;">
                </label>
              </div>
            </sc-if>
            <sc-if value="{{s.isText}}" hint-placeholder-val="{{false}}">
              <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:18px;font-weight:600;color:#5A6478;">{{s.title}}
                <input type="text" value="{{s.value}}" style="height:48px;border:1px solid #9BC4EE;border-radius:12px;padding:0 12px;font-family:inherit;font-size:15px;color:#0E121C;background:#FFFFFF;box-sizing:border-box;width:100%;">
              </label>
            </sc-if>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <sc-for list="{{s.alts}}" as="a" hint-placeholder-count="2">
                <button type="button" onClick="{{a.pick}}" style="height:44px;padding:0 14px;border-radius:999px;border:1px solid #DCE3EF;background:#FFFFFF;color:#3A4256;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;">{{a.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ol>

  <div style="flex:1;"></div>
  <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
    <button type="button" onClick="{{next}}" style="flex:none;display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:20px;border:0;border-radius:16px;background:#6172B5;color:#FFFFFF;font-family:inherit;font-size:16px;line-height:24px;font-weight:600;cursor:pointer;">{{nextLabel}}</button>
  </sc-if>
  <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
    <a href="HabitsHub.dc.html" style="flex:none;display:flex;align-items:center;justify-content:center;height:52px;margin-top:20px;border-radius:16px;background:#6172B5;color:#FFFFFF;text-decoration:none;font-size:16px;line-height:24px;font-weight:600;">احفظي العادة</a>
  </sc-if>
  <a href="HabitsHub.dc.html" style="flex:none;display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:6px;color:#4F5FA0;text-decoration:none;font-size:16px;line-height:24px;font-weight:600;">احفظيها كمسودة</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cur: 2,
      values: [
        'أرفع درجتي في IELTS — الهدف تحددينه أنتِ',
        'أراجع بطاقات المفردات المستحقة',
        'أدنى 5 بطاقات · عادي 10 د · إضافي 15 د',
        'بعد الفطور',
        'التطبيق في الشاشة الأولى، والسماعة جاهزة',
        'مع قهوة الصباح',
        'إذا تأخرت، أراجع 5 بطاقات في الطريق',
        'تطبيقات التواصل في مجلد بالصفحة الثانية',
        'بدون تذكير — سلسلة الصباح تكفي'
      ]
    };
  }
  setValue(i, v) {
    var vals = this.state.values.slice();
    vals[i] = v;
    this.setState({ values: vals });
  }
  renderVals() {
    var self = this;
    var cur = this.state.cur;
    var defs = [
      { title: 'الهدف', help: 'الهدف يوجّه العادة، وما يظهر كمهمة يومية.', alts: [] },
      { title: 'السلوك', help: 'فعل واضح تقدرين تشوفينه: وش بالضبط تسوين؟', alts: ['أراجع 10 كلمات جديدة', 'أراجع البطاقات المستحقة'] },
      { title: 'النسخ: أدنى · عادي · إضافي', help: 'الأدنى يُحسب إنجازًا كاملًا. خليه صغير لدرجة يصعب ترفضينه.', alts: [], versions: true },
      { title: 'الإشارة', help: 'بعد شي تسوينه أصلًا كل يوم — أو وقت أو مكان ثابت.', alts: ['بعد الفطور', 'بعد صلاة الظهر', 'في الطريق للجامعة'] },
      { title: 'التحضير', help: 'قلّلي الخطوات قبل البداية.', alts: ['التطبيق في الشاشة الأولى', 'البطاقات جنب المكتب'] },
      { title: 'ربط بمتعة', help: 'شي تحبينه يصاحب العادة — من خريطة متعتك.', alts: ['مع قهوة الصباح', 'مع موسيقى هادئة'] },
      { title: 'خطة إذا… فإني', help: 'وش العائق المتوقع؟ وش تسوين وقتها؟', alts: ['إذا تأخرت، أراجع 5 بطاقات في الطريق', 'إذا تعبت، أكتفي بالأدنى'] },
      { title: 'صعّبي المُغري', help: 'اللي يسرق الوقت: خليه أبعد بخطوة.', alts: ['تطبيقات التواصل في الصفحة الثانية', 'الجوال على وضع التركيز'] },
      { title: 'التذكير', help: 'أقل عدد تنبيهات ممكن. السلسلة غالبًا تكفي.', alts: ['بدون تذكير — السلسلة تكفي', 'تنبيه واحد 08:30'] }
    ];
    var steps = defs.map(function (d, i) {
      var done = i < cur;
      var open = i === cur;
      return {
        title: d.title,
        value: self.state.values[i],
        help: d.help,
        expanded: open ? 'true' : 'false',
        showEditor: open,
        isVersions: !!d.versions,
        isText: !d.versions,
        suggested: i > cur,
        done: done,
        notDone: !done,
        num: String(i + 1),
        badgeStyle: 'flex:none;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:999px;font-family:\'IBM Plex Sans\',sans-serif;font-size:13px;font-weight:600;box-sizing:border-box;' + (done ? 'background:#E3F0E8;color:#2F6B4A;' : (open ? 'background:#6172B5;color:#FFFFFF;' : 'background:#FFFFFF;color:#5A6478;border:1px solid #DCE3EF;')),
        valueStyle: 'font-size:13px;line-height:20px;font-weight:500;color:' + (i > cur ? '#5A6478' : '#3A4256') + ';',
        cardStyle: 'border-radius:20px;background:#FFFFFF;' + (open ? 'border:2px solid #9BC4EE;' : 'border:1px solid #DCE3EF;'),
        open: function () { self.setState({ cur: i }); },
        alts: d.alts.map(function (a) { return { label: a, pick: function () { self.setValue(i, a); } }; })
      };
    });
    var bar = defs.map(function (d, i) {
      return { s: 'height:6px;border-radius:999px;background:' + (i <= cur ? '#6172B5' : '#DCE3EF') + ';' };
    });
    var nextTitle = cur < 8 ? defs[cur + 1].title.split(':')[0] : '';
    return {
      steps: steps,
      bar: bar,
      stepNo: cur + 1,
      notLast: cur < 8,
      isLast: cur === 8,
      nextLabel: 'التالي: ' + nextTitle,
      next: function () { self.setState({ cur: Math.min(8, cur + 1) }); }
    };
  }
}
</script>
</body>
</html>
